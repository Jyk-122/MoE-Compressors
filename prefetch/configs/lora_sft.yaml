seed: 42
stage: lora
output_dir: prefetch/outputs/attention_lora
model:
  path: /path/to/full/BF16/checkpoint
  quantization: experts_nf4
  serial_load: true
lora:
  enabled: true
  checkpoint: null
  rank: 16
  alpha: 32
  dropout: 0.0
data:
  seed: 42
  max_length: 2048
  max_image_side: 672
  router_tokens: assistant
  num_workers: 0
  train:
    - {path: prefetch/data/cog/train.filtered.jsonl, weight: 0.5}
    - {path: prefetch/data/tulu/train.filtered.jsonl, weight: 0.5}
  validation:
    vl: {path: prefetch/data/cog/validation.filtered.jsonl, limit: 128}
    text: {path: prefetch/data/tulu/validation.filtered.jsonl, limit: 128}
training:
  max_steps: 1000
  gradient_accumulation: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 50
  max_grad_norm: 1.0
  gradient_checkpointing: true
  log_every: 10
  eval_every: 100
  save_every: 100
