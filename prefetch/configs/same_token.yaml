seed: 42
stage: router
output_dir: prefetch/outputs  # Parent directory; each run creates <mode>_<startup time>.
model:
  path: /path/to/full/BF16/checkpoint
  quantization: none  # none | experts_nf4
  nf4_blocksize: 64
  nf4_checkpoint: null      # Packed checkpoint directory from backbone.export_nf4.
  # Confirm that the full VL wrapper forwards this argument in smoke_test.
  router_forward_kwargs: {logits_to_keep: 1}
lora:
  enabled: false
  checkpoint: null
  rank: 16
  alpha: 32
  dropout: 0.0
prefetch:
  mode: same_token
  distance: 1              # Count preceding MoE blocks, starting from ordinal 0.
  targets: null            # e.g. [2, 3, ..., 34] for a common M=1/M=2 layer set.
  head: mlp                # mlp | linear (initialized from target gate)
  hidden_dim: 512
  loss: score_kl           # score_kl | logit_kl
  temperature: 0.1
  ks: [8, 12, 16, 24, 48, 96, 192, 384]
data:
  seed: 42
  max_length: 2048
  max_image_side: null
  router_tokens: assistant # Response-input supervision.
  num_workers: 0
  # train_limit: 128       # Optional total after mixing; CLI --limit overrides this.
  train:
    - {path: prefetch/data/cog/train.filtered.jsonl, weight: 0.5}
    - {path: prefetch/data/tulu/train.filtered.jsonl, weight: 0.5}
  validation:
    vl: {path: prefetch/data/cog/validation.filtered.jsonl, limit: 128}
    text: {path: prefetch/data/tulu/validation.filtered.jsonl, limit: 128}
training:
  max_steps: 10000
  gradient_accumulation: 4
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_steps: 50
  max_grad_norm: 1.0
  gradient_checkpointing: true  # Used in stage=lora.
  log_every: 10
  eval_every: 1000
  save_every: 1000
